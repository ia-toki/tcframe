[project]
name = "tcframe-cli"
version = "0.1.0"
description = "Python orchestration CLI for the tcframe 2.0 problem-package toolchain"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
tcframe = "tcframe_cli.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tcframe_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
